<!DOCTYPE html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Übersicht</title>
    <meta name="google" content="notranslate" />
    <meta name="description" content="Übersicht über Alex' Websites und Projekte." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Übersicht" />
    <meta property="og:description" content="Übersicht über Alex' Websites und Projekte." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Übersicht" />
    <meta name="twitter:description" content="Übersicht über Alex' Websites und Projekte." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms: registered at deploy time so the app can submit without a server. -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="teacherName" /><textarea name="feedback"></textarea><input name="rating" />
    </form>
    <form name="feedback-report" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="feedbackId" /><input name="reason" /><textarea name="details"></textarea>
    </form>
    <form name="member-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="name" /><input name="email" /><textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
