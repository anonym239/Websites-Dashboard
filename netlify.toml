[build]
  command = "pnpm --filter @workspace/website-admin-dashboard run build"
  publish = "artifacts/website-admin-dashboard/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  PORT = "24852"
  BASE_PATH = "/"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200