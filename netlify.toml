# Static deploy – no serverless API and no database needed.
# The build first pulls the current Netlify sites into data/site-data.json
# (needs NETLIFY_AUTH_TOKEN in the site's environment variables).
[build]
  command = "node scripts/sync-netlify.mjs && pnpm --filter @workspace/website-admin-dashboard run build"
  publish = "artifacts/website-admin-dashboard/dist/public"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  PORT = "24852"
  BASE_PATH = "/"
  VITE_API_MODE = "local"

# Project data must never be served from a stale cache.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
