openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: websites
    description: Public website catalog and protected management
  - name: dashboard
    description: Dashboard summaries and activity
  - name: users
    description: User and role management
  - name: session
    description: Current authenticated user
  - name: netlify
    description: Import projects from Netlify
  - name: feedback
    description: Public teacher feedback
  - name: events
    description: Public announcements managed by administrators
  - name: members
    description: Authenticated member features
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /websites:
    get:
      operationId: listWebsites
      tags: [websites]
      summary: List published websites
      responses:
        "200":
          description: Website entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Website"
    post:
      operationId: createWebsite
      tags: [websites]
      summary: Add a website
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteInput"
      responses:
        "201":
          description: Created website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "401":
          description: Authentication required
        "403":
          description: Insufficient role
  /netlify/import:
    post:
      operationId: importNetlifyWebsites
      tags: [netlify]
      summary: Import and synchronize Netlify projects
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetlifyImportResult"
        "401":
          description: Authentication required
        "403":
          description: Insufficient role
        "503":
          description: Netlify token is not configured
  /events/active:
    get:
      operationId: listActiveEvents
      tags: [events]
      summary: List the active public events
      responses:
        "200":
          description: Active public events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
  /events/manage:
    get:
      operationId: listManagedEvents
      tags: [events]
      summary: List events for account management
      responses:
        "200":
          description: All events with activation state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "401":
          description: Authentication required
        "403":
          description: Admin role required
  /events:
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a public event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event
        "401":
          description: Authentication required
        "403":
          description: Admin role required
  /events/{eventId}:
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update a public event
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "404":
          description: Event not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete a public event
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "404":
          description: Event not found
  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List public teacher feedback
      responses:
        "200":
          description: Recent teacher feedback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit teacher feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Saved feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          description: Invalid feedback
        "409":
          description: A very similar feedback submission was already received recently
        "429":
          description: Too many feedback submissions from the same source
          headers:
            Retry-After:
              description: Seconds until another submission may be attempted
              schema:
                type: integer
  /feedback/stats:
    get:
      operationId: getFeedbackStats
      tags: [feedback]
      summary: Get public teacher feedback statistics
      description: Returns aggregate statistics for visible teacher feedback only
      responses:
        "200":
          description: Public teacher feedback statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStats"
  /feedback/manage:
    get:
      operationId: listManagedFeedback
      tags: [feedback]
      summary: List feedback for account management
      responses:
        "200":
          description: All teacher feedback with visibility state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedFeedback"
        "401":
          description: Authentication required
        "403":
          description: Insufficient role
  /feedback/{feedbackId}:
    patch:
      operationId: updateFeedback
      tags: [feedback]
      summary: Change feedback visibility
      parameters:
        - $ref: "#/components/parameters/FeedbackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackUpdate"
      responses:
        "200":
          description: Updated feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedFeedback"
        "401":
          description: Authentication required
        "403":
          description: Insufficient role
        "404":
          description: Feedback not found
    delete:
      operationId: deleteFeedback
      tags: [feedback]
      summary: Delete feedback
      parameters:
        - $ref: "#/components/parameters/FeedbackId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "404":
          description: Feedback not found
  /feedback/{feedbackId}/history:
    get:
      operationId: listFeedbackHistory
      tags: [feedback]
      summary: List feedback moderation history
      parameters:
        - $ref: "#/components/parameters/FeedbackId"
      responses:
        "200":
          description: Moderation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackModerationHistory"
        "401":
          description: Authentication required
        "403":
          description: Insufficient role
        "404":
          description: Feedback not found
  /feedback/{feedbackId}/report:
    post:
      operationId: createFeedbackReport
      tags: [feedback]
      summary: Report public feedback
      parameters:
        - $ref: "#/components/parameters/FeedbackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackReportInput"
      responses:
        "201":
          description: Feedback report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReport"
        "400":
          description: Invalid report
        "404":
          description: Feedback not found
        "409":
          description: A matching open report already exists
  /feedback/reports:
    get:
      operationId: listFeedbackReports
      tags: [feedback]
      summary: List feedback reports for moderators
      responses:
        "200":
          description: Feedback reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackReport"
        "401":
          description: Authentication required
        "403":
          description: Insufficient role
  /feedback/reports/{reportId}:
    patch:
      operationId: updateFeedbackReport
      tags: [feedback]
      summary: Resolve a feedback report
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackReportUpdate"
      responses:
        "200":
          description: Updated feedback report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReport"
        "400":
          description: Invalid report status
        "401":
          description: Authentication required
        "403":
          description: Insufficient role
        "404":
          description: Report not found
  /websites/{websiteId}:
    patch:
      operationId: updateWebsite
      tags: [websites]
      summary: Update a website
      parameters:
        - $ref: "#/components/parameters/WebsiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteUpdate"
      responses:
        "200":
          description: Updated website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "401":
          description: Authentication required
        "403":
          description: Insufficient role
        "404":
          description: Website not found
    delete:
      operationId: deleteWebsite
      tags: [websites]
      summary: Remove a website
      parameters:
        - $ref: "#/components/parameters/WebsiteId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Authentication required
        "403":
          description: Insufficient role
        "404":
          description: Website not found
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
  /dashboard/activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
        "401":
          description: Authentication required
  /admin/activity:
    get:
      operationId: listAdminActivity
      tags: [dashboard]
      summary: List the administrator audit log
      responses:
        "200":
          description: Administrator audit log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
        "401":
          description: Authentication required
        "403":
          description: Admin role required
  /member/favorites:
    get:
      operationId: listMemberFavorites
      tags: [members]
      summary: List the current member's favorite websites
      responses:
        "200":
          description: Favorite websites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Website"
        "401":
          description: Authentication required
  /member/favorites/{websiteId}:
    post:
      operationId: createMemberFavorite
      tags: [members]
      summary: Save a website to the member's favorites
      parameters:
        - $ref: "#/components/parameters/WebsiteId"
      responses:
        "201":
          description: Favorite website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
        "401":
          description: Authentication required
        "404":
          description: Website not found
    delete:
      operationId: deleteMemberFavorite
      tags: [members]
      summary: Remove a website from the member's favorites
      parameters:
        - $ref: "#/components/parameters/WebsiteId"
      responses:
        "204":
          description: Removed
        "401":
          description: Authentication required
  /member/requests:
    get:
      operationId: listMemberRequests
      tags: [members]
      summary: List the current member's project requests
      responses:
        "200":
          description: Member project requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberRequest"
        "401":
          description: Authentication required
    post:
      operationId: createMemberRequest
      tags: [members]
      summary: Send a project request to the administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRequest"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
  /member/requests/{requestId}/history:
    get:
      operationId: listMemberRequestHistory
      tags: [members]
      summary: List the status history of a member request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Member request history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberRequestHistory"
        "401":
          description: Authentication required
        "403":
          description: Not allowed to view this request
        "404":
          description: Request not found
  /member/requests/{requestId}:
    patch:
      operationId: updateMemberRequest
      tags: [members]
      summary: Add a message to a member request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequestUpdate"
      responses:
        "200":
          description: Updated member request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRequest"
        "400":
          description: Invalid request message
        "401":
          description: Authentication required
        "403":
          description: Not allowed to edit this request
        "404":
          description: Request not found
    delete:
      operationId: withdrawMemberRequest
      tags: [members]
      summary: Withdraw the current member's request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Withdrawn member request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRequest"
        "401":
          description: Authentication required
        "403":
          description: Not allowed to withdraw this request
        "404":
          description: Request not found
  /member/notifications:
    get:
      operationId: listMemberNotifications
      tags: [members]
      summary: List the current member's notifications
      responses:
        "200":
          description: Member notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberNotification"
        "401":
          description: Authentication required
  /member/notifications/{notificationId}/read:
    patch:
      operationId: markMemberNotificationRead
      tags: [members]
      summary: Mark a member notification as read
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberNotification"
        "401":
          description: Authentication required
        "404":
          description: Notification not found
  /member/profile:
    get:
      operationId: getMemberProfile
      tags: [members]
      summary: Get the current member profile settings
      responses:
        "200":
          description: Member profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "401":
          description: Authentication required
    patch:
      operationId: updateMemberProfile
      tags: [members]
      summary: Update the current member profile settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfileUpdate"
      responses:
        "200":
          description: Updated member profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "400":
          description: Invalid profile settings
        "401":
          description: Authentication required
  /requests/manage:
    get:
      operationId: listManagedMemberRequests
      tags: [members]
      summary: List member requests for administrators
      responses:
        "200":
          description: All member requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberRequest"
        "401":
          description: Authentication required
        "403":
          description: Admin role required
  /requests/{requestId}/status:
    patch:
      operationId: updateMemberRequestStatus
      tags: [members]
      summary: Update a member request status
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequestStatusUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRequest"
        "400":
          description: Invalid status
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "404":
          description: Request not found
  /requests/{requestId}:
    delete:
      operationId: deleteManagedMemberRequest
      tags: [members]
      summary: Delete a member request as an administrator
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: Request deleted
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "404":
          description: Request not found
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List registered users
      responses:
        "200":
          description: Registered users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
        "401":
          description: Authentication required
        "403":
          description: Admin role required
  /session/me:
    get:
      operationId: getCurrentUser
      tags: [session]
      summary: Get the current application user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "401":
          description: Authentication required
  /users/{userId}/role:
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: Change a user's role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "404":
          description: User not found
components:
  parameters:
    WebsiteId:
      name: websiteId
      in: path
      required: true
      schema:
        type: integer
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema:
        type: integer
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Website:
      type: object
      required: [id, name, url, status, visits, updatedAt, ownerName]
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string, format: uri }
        githubUrl: { type: ["string", "null"], format: uri }
        imageUrl: { type: ["string", "null"], format: uri }
        description: { type: ["string", "null"] }
        status:
          type: string
          enum: [live, draft, paused]
        visits: { type: integer }
        updatedAt: { type: string, format: date-time }
        ownerName: { type: string }
    WebsiteInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string, minLength: 1 }
        url: { type: string, format: uri }
        githubUrl: { type: ["string", "null"], format: uri }
        description: { type: ["string", "null"] }
        status:
          type: string
          enum: [live, draft, paused]
    WebsiteUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        url: { type: string, format: uri }
        githubUrl: { type: ["string", "null"], format: uri }
        description: { type: ["string", "null"] }
        status:
          type: string
          enum: [live, draft, paused]
    NetlifyImportResult:
      type: object
      required: [imported, updated, skipped, total]
      properties:
        imported: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        total: { type: integer }
    Feedback:
      type: object
      required: [id, teacherName, feedback, rating, createdAt]
      properties:
        id: { type: integer }
        teacherName: { type: string }
        feedback: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        createdAt: { type: string, format: date-time }
    FeedbackInput:
      type: object
      required: [teacherName, feedback, rating]
      properties:
        teacherName: { type: string, minLength: 2, maxLength: 80 }
        feedback: { type: string, minLength: 3, maxLength: 500 }
        rating: { type: integer, minimum: 1, maximum: 5 }
    FeedbackStats:
      type: object
      required: [averageRating, totalCount, distribution]
      properties:
        averageRating:
          type: number
          minimum: 0
          maximum: 5
        totalCount:
          type: integer
          minimum: 0
        distribution:
          type: object
          required: [oneStar, twoStars, threeStars, fourStars, fiveStars]
          properties:
            oneStar: { type: integer, minimum: 0 }
            twoStars: { type: integer, minimum: 0 }
            threeStars: { type: integer, minimum: 0 }
            fourStars: { type: integer, minimum: 0 }
            fiveStars: { type: integer, minimum: 0 }
    ManagedFeedback:
      allOf:
        - $ref: "#/components/schemas/Feedback"
        - type: object
          required: [isVisible]
          properties:
            isVisible: { type: boolean }
    FeedbackUpdate:
      type: object
      required: [isVisible]
      properties:
        isVisible: { type: boolean }
        reason: { type: [string, "null"], maxLength: 500 }
    FeedbackModerationHistory:
      type: object
      required: [id, feedbackId, action, actorId, actorName, createdAt]
      properties:
        id: { type: integer }
        feedbackId: { type: integer }
        action:
          type: string
          enum: [published, hidden, deleted]
        reason: { type: [string, "null"] }
        actorId: { type: string }
        actorName: { type: string }
        createdAt: { type: string, format: date-time }
    FeedbackReportInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [spam, offensive, advertising, duplicate, other]
        details: { type: [string, "null"], maxLength: 500 }
    FeedbackReport:
      type: object
      required: [id, feedbackId, reason, status, createdAt]
      properties:
        id: { type: integer }
        feedbackId: { type: integer }
        reason:
          type: string
          enum: [spam, offensive, advertising, duplicate, other]
        details: { type: [string, "null"] }
        status:
          type: string
          enum: [open, reviewed, dismissed]
        reviewedBy: { type: [string, "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    FeedbackReportUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [reviewed, dismissed]
    Event:
      type: object
      required: [id, title, message, isActive, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string }
        imageUrl: { type: ["string", "null"], format: uri }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
